project_id = "rcqluqbrqiyyfrpfryvl"

# Every verify_jwt below matches the live setting. A CLI deploy picks the value
# up from here, so a `false` that differs from live silently drops JWT
# verification on the next deploy.

[functions.extract-prescription]
# Reads patient data and calls a paid model; the in-code getUser() check is a
# second layer, not a replacement for the gateway check.
verify_jwt = true

[functions.generate-patient-pdf]
# This function reads patient records.
verify_jwt = true
# Noto Sans, read at runtime: the standard Helvetica font cannot encode ₹,
# curly quotes and much else, and pdf-lib throws on the first such character.
static_files = ["./functions/generate-patient-pdf/fonts/*.ttf"]

[functions.send-test-attendance-email]
verify_jwt = true

[functions.attendance-notifications]
# Called by pg_cron without a user JWT; protected by the CRON_SECRET header.
verify_jwt = false

[functions.ops-alerts]
# Called by pg_cron without a user JWT; protected by the CRON_SECRET header.
verify_jwt = false

[functions.sweep-orphan-uploads]
# Called by pg_cron without a user JWT; protected by the CRON_SECRET header.
verify_jwt = false

[functions.vapid-public-key]
verify_jwt = true
