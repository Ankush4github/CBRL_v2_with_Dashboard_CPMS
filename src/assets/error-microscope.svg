<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Drawn as strokes on a 64-unit grid rather than filled shapes on an 800-unit
       one: the artwork renders at 112px, where a 2px stroke in an 800 viewBox
       scales to roughly a quarter of a pixel and disappears. Colour comes from
       `currentColor` so it inherits the surrounding text colour and follows the
       light/dark theme. Every attribute is presentational — no stylesheet to
       fail to load. -->

  <!-- bench -->
  <path d="M8 55h48" opacity=".3" />
  <!-- base -->
  <path d="M19 55c0-4 3-7 7-7h8c4 0 7 3 7 7" />
  <!-- pillar -->
  <path d="M30 48V38" />
  <!-- stage -->
  <path d="M15 38h20" />
  <!-- arm -->
  <path d="M36 21c10 5 12 18 1 26" />
  <!-- objective housing -->
  <path d="M24 18h12v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z" />
  <!-- objective -->
  <path d="M30 28v6" />
  <!-- eyepiece -->
  <path d="M27 18v-7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v7" />
</svg>
